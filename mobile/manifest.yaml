android:
  gradle: true
  assets:
    - "../assets"
  icon: "ios-src/Assets.xcassets/AppIcon.appiconset/icon_1024x1024.png"
  manifest:
    package: "com.terrafolk.rust"
    version_code: 26 # Todo you should start at 1
    # 라이브 접속(net/native_conn.rs — 2026-10-18부터) — TCP/WS 소켓에 필수.
    # 누락 시 소켓 생성 자체가 EACCES로 실패(데모 관전만 가능했던 시절 불필요).
    uses_permission:
      - name: android.permission.INTERNET
    application:
      label: "Terrafolk" # Todo
      # F2 계정 — OAuth 콜백 terrafolk://auth 딥링크(콜백이 스킴으로 302).
      # 첫 activity는 xbuild가 MAIN/LAUNCHER·NativeActivity 기본값을 채운다.
      activities:
        - intent_filters:
            - actions: ["android.intent.action.VIEW"]
              categories:
                ["android.intent.category.DEFAULT", "android.intent.category.BROWSABLE"]
              data:
                - scheme: "terrafolk"

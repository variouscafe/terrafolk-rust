[package]
name = "terrafolk_bevy"
version = "0.8.3"
publish = false
edition = "2024"
exclude = ["dist", "build", "assets", "credits"]

[workspace]
members = ["mobile", "crates/ws-link", "crates/colyseus-lite", "proto2d"]

[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1

# trunk 가 커스텀 프로파일을 못 쓰는 관계(https://github.com/trunk-rs/trunk/issues/605)
# release = 웹 배포 프로파일(크기 우선). dist = 네이티브 배포(성능 우선).
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"   # wasm 언와인딩 제거 — 크기 절감(Cloudflare Pages 25MiB 제한 대응)

[profile.dist]
inherits = "release"
opt-level = 3
lto = true
codegen-units = 1
strip = true

[features]
dev = [
    "bevy/dynamic_linking",
]
no-ui = []
ui-min = []

[dependencies]
bevy = { version = "0.20.0", default-features = false, features = [
    "3d",
    "png",
    "bevy_asset",
    "bevy_text",
    "bevy_ui",
    "bevy_ui_render",
    "bevy_ui_widgets",
    "ui_picking",
] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# keep the following in sync with Bevy's dependencies (main.rs 창 아이콘)
winit = { version = "0.30", default-features = false }
image = { version = "0.25", default-features = false }
## WGPU trace! 호출이 많아 log 디버그 레벨 필요
log = { version = "0.4", features = ["max_level_debug", "release_max_level_warn"] }

[build-dependencies]
embed-resource = "1"

# 네이티브 라이브 접속(net/native_conn.rs) — wasm은 JS(colyseus.js) 경로 유지.
# rustls 한정: 안드로이드 크로스컴파일에서 native-tls/openssl 금지.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ws-link = { path = "crates/ws-link" }
colyseus-lite = { path = "crates/colyseus-lite" }
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = ["console", "Window", "Location"] }
wasm-bindgen = "0.2"
js-sys = "0.3"

[target.'cfg(target_os = "android")'.dependencies]
# 세이프에어리어 JNI 쿼리(platform/safe_area) — bevy 전이 의존과 동일 계열
ndk-context = "0.1"
jni = "0.21"

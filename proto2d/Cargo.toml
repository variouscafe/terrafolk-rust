[package]
name = "terrafolk_proto2d"
version = "0.1.0"
publish = false
edition = "2024"

# 2D 도트 프로토타입 — 원본 FE(../terrafolk 웹) 픽셀 룩 패리티.
# 루트 워크스페이스 프로파일(release=크기 우선) 공유.
[dependencies]
bevy = { version = "0.19.1", default-features = false, features = [
    "2d",
    "png",
    "bevy_asset",
    "bevy_text",
    "webgl2", # wasm 기본 WebGPU 우선 → 실브라우저에서 빈 회면(2026-10-19 실측). GL 강제.
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bevy_egui = { version = "0.40", default-features = false, features = [
    "render",
    "manage_clipboard", # 채팅 입력 붙여넣기
    "default_fonts",    # 라틴 기본(한글은 런트임 에셋 폰트 — fonts.rs)
    "open_url",
] }  # bevy 0.19 정확 대응 — bevy_ui·picking 등 미사용 피처 제거로 wasm 다이어트(CF 25MiB)
egui-phosphor = "0.12.0"
egui-toast = "0.20.0"
egui_extras = { version = "0.34.3", features = ["http", "image", "file"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = ["console", "Window", "Document", "HtmlDocument", "Element", "Node", "Location"] }
wasm-bindgen = "0.2"
js-sys = "0.3"

# 라이브 접속(네이티브) — colyseus-lite가 ws-link·rustls를 경로 의존으로 당김.
# rustls 한정 — 크로스컴파일(Android) 규칙 준수.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
colyseus-lite = { path = "../crates/colyseus-lite" }
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
log = "0.4"

<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover" />
        <title>Terrafolk 2D proto</title>
        <link data-trunk rel="copy-dir" href="assets" />
        <link data-trunk rel="copy-dir" href="functions" />
        <style>
            html,
            body {
                margin: 0;
                height: 100%;
                background: #1d2b19; /* ClearColor와 동일 톤 — 로딩/부트 경계 최소화 */
                overflow: hidden;
            }
            #boot {
                position: fixed;
                inset: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                color: #d8e8c8;
                font-family: system-ui, sans-serif;
                font-size: 15px;
                letter-spacing: 0.04em;
                pointer-events: none;
            }
            #status {
                position: fixed;
                left: 0;
                right: 0;
                bottom: 0;
                padding: 6px 10px calc(6px + env(safe-area-inset-bottom));
                background: rgba(10, 14, 8, 0.72);
                color: #cfe6b8;
                font-family: ui-monospace, Menlo, monospace;
                font-size: 12px;
                letter-spacing: 0.02em;
                text-align: center;
                pointer-events: none;
                z-index: 10;
            }
            #gldiag {
                position: fixed;
                left: 0;
                right: 0;
                bottom: 34px;
                padding: 2px 10px;
                color: #9fd08a;
                font-family: ui-monospace, Menlo, monospace;
                font-size: 11px;
                text-align: center;
                pointer-events: none;
                z-index: 10;
            }
            canvas {
                width: 100vw;
                height: 100vh;
                display: block;
                touch-action: none;
            }
        </style>
    </head>
    <body>
        <div id="boot">월드를 여는 중… (v2)</div>
        <canvas id="bevy"></canvas>
        <div id="gldiag"></div>
        <div id="status">v3.4-019 부팅…</div>
        <!-- 라이브 브리지 — colyseus.js(벤더 UMD) 먼저, worldsim.js가 DOMContentLoaded에
             접속. Rust(wasm)는 Startup에 window.terrafolk.setSink(fn) 등록 — 늦게 등록돼도
             worldsim.js가 lastMap을 캐시해 매 스냅숏 map을 재전송하므로 첫 상태 유실 없음.
             ?live=0이면 worldsim.js가 접속 자체를 중단(데모 강제). -->
        <script src="assets/web/colyseus.js"></script>
        <script src="assets/web/worldsim.js"></script>
        <script>
            // GL 실측 진단 — 렌더러명·GL 에러 누적(2초 주기). Rust 상태줄과 별도 라인.
            function __countGlErrs(gl) {
                var e = 0;
                while (gl.getError() !== gl.NO_ERROR && e < 99) e++;
                return e;
            }
            (function () {
                setInterval(function () {
                    var c = document.getElementById('bevy');
                    var s = document.getElementById('gldiag');
                    if (!c || !s) return;
                    var gl = c.getContext('webgl2');
                    if (!gl) {
                        s.textContent = 'gl: no-webgl2-context';
                        return;
                    }
                    var r = String(gl.getParameter(gl.RENDERER) || '?');
                    s.textContent = 'gl: ' + r.slice(0, 36) + ' · err+' + __countGlErrs(gl);
                }, 2000);
                // 진단 비컨 — 폰 실측(GPU·에러·상태줄·UA·URL)을 서버로 전송
                function send(tag) {
                    var c = document.getElementById('bevy');
                    var gl = c && c.getContext('webgl2');
                    var glInfo = 'nogl';
                    if (gl) {
                        var ext = gl.getExtension('WEBGL_debug_renderer_info');
                        var gpu = ext ? String(gl.getParameter(ext.UNMASKED_RENDERER_WEBGL)).slice(0, 60) : 'masked';
                        glInfo = gpu + ' err+' + __countGlErrs(gl) + ' max' + gl.getParameter(gl.MAX_TEXTURE_SIZE);
                    }
                    var st = (document.getElementById('status') || {}).textContent || '';
                    try {
                        fetch('/api/diag', {
                            method: 'POST',
                            body: JSON.stringify({
                                tag: tag,
                                ua: navigator.userAgent.slice(0, 160),
                                url: location.href,
                                gl: glInfo,
                                status: st.slice(0, 200)
                            })
                        }).catch(function () {});
                    } catch (e) {}
                }
                setTimeout(function () { send('5s'); }, 5000);
                setTimeout(function () { send('15s'); }, 15000);
                setTimeout(function () { send('40s'); }, 40000);
            })();
        </script>
        <script>
            // 캔버스가 실제 초기화되면(300x150 탈출) 부트 문구 제거
            (function () {
                var t = setInterval(function () {
                    var c = document.getElementById('bevy');
                    if (c && c.width > 300) {
                        clearInterval(t);
                        var b = document.getElementById('boot');
                        if (b) b.remove();
                    }
                }, 300);
            })();
        </script>
    </body>
</html>
